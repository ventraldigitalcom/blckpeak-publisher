name: Verify Buffer connection (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-buffer.yml'
      - 'scripts/check_buffer.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Check API key and all three connected channels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Buffer key without posting
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/check_buffer.py
      - name: Report publish opt-in (no posts created)
        if: always()
        env:
          PUBLISHING_ENABLED: ${{ vars.PUBLISHING_ENABLED }}
        run: |
          if [ "$PUBLISHING_ENABLED" = "true" ]; then
            echo "PASS: PUBLISHING_ENABLED is true"
          else
            echo "BLOCKED: PUBLISHING_ENABLED is not true"
          fi
