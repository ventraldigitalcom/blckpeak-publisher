name: Verify Buffer connection (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-buffer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Check API key and all three connected channels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Buffer key without posting
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/check_buffer.py
