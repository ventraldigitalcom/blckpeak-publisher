name: BLCKPEAK safety checks
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/safety-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg for actual media regression tests
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Python compile
        run: python3 -m py_compile scripts/publisher.py
      - name: Offline approval safety tests
        run: python3 -m unittest discover -s tests -v
      - name: FFmpeg is available
        run: ffmpeg -hide_banner -version | head -n 1
